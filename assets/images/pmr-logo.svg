<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pmiRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Outer circle with golden border -->
  <circle cx="50" cy="50" r="46" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <!-- Laurel / Decorative Arc -->
  <circle cx="50" cy="50" r="37" fill="none" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- Red Cross in Center -->
  <g filter="url(#shadow)">
    <!-- Vertical bar -->
    <rect x="42" y="24" width="16" height="52" rx="3" fill="url(#pmiRed)"/>
    <!-- Horizontal bar -->
    <rect x="24" y="42" width="52" height="16" rx="3" fill="url(#pmiRed)"/>
  </g>
  <!-- Center emblem dot or mini accent -->
  <circle cx="50" cy="50" r="3" fill="#FFFFFF" opacity="0.9"/>
</svg>
